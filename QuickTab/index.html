<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTab</title>
    <link rel="stylesheet" href="res/css/main.css">
    <link rel="stylesheet" href="res/css/widgets.css">

</head>

<body>
    <div id="theme-container">

    </div>

    <!-- WIDGETS -->
    <div id="widget-container">
        <div class="menu-page">
            <!-- ROW 1 -->
            <div class="widget-wrapper">

                <!-- CALENDAR -->
                <div class="calendar-container">
                    <div class="calendar">
                        <div class="calendar-header">
                            <h2 id="currentMonth"></h2>
                            <div>
                                <button id="prevMonth">
                                    <img src="../res/logo/anglel.svg" alt="Prev">
                                </button>
                                <button id="nextMonth">
                                    <img src="../res/logo/angler.svg" alt="Next">
                                </button>
                            </div>
                        </div>
                        <div class="calendar-body">
                            <div class="weekdays">
                                <div>Sun</div>
                                <div>Mon</div>
                                <div>Tue</div>
                                <div>Wed</div>
                                <div>Thu</div>
                                <div>Fri</div>
                                <div>Sat</div>
                            </div>

                            <div class="days"></div>
                        </div>
                    </div>
                </div>


                <div class="vertical-wrapper">

                    <!-- WEATHER -->
                    <div class="weather-container">
                        <div class="weather-heading">
                            <div>
                                <img src="/res/logo/weather/Cloudy.svg" id="weatherIcon" alt="weather">
                                <h3 class="weather-value" id="temperature"></h3>
                            </div>
                        </div>
                        <div class="weather-body">
                            <div class="weather-option">
                                <img src="/res/logo/weather/Humidity.svg" alt="humidity">
                                <p class="humidity-value" id="humidity"></p>
                            </div>
                            <div class="weather-option">
                                <img src="../res/logo/weather/Wind.svg" alt="wind_speed">
                                <p class="humidity-value" id="windSpeed"></p>
                            </div>
                            <div class="weather-option">
                                <img src="../res/logo/weather/Temperature.svg" alt="feels_like">
                                <p class="humidity-value" id="feelsLike"></p>
                            </div>
                            <div class="weather-option">
                                <img src="../res/logo/weather/Thermometer.svg" alt="temp_min_max">
                                <p class="humidity-value" id="highTemp"></p>
                            </div>
                        </div>
                        <div class="weather-footer">
                            <p id="location"></p>
                        </div>
                    </div>

                    <!-- CALCULATOR -->
                    <div class="calculator-container">
                        <div class="calculator-heading">
                            <img src="/res/logo/calculator.svg" alt="calculator">
                            <p class="calc-value" id="calcResult">= </p>
                        </div>
                        <input type="text" id="calcInput" placeholder="..." autocomplete="off">
                    </div>
                </div>

                <div class="vertical-wrapper">

                    <!-- MEDIA CONTROLLER -->
                    <div class="media-controller-container">
                        <div class="media-header">
                            <img src="res/logo/media/play.svg" alt="icon">
                            <span id="mediaTitle">YouTube Player</span>
                        </div>
                        <div class="media-controls">
                            <!-- Play/Pause -->
                            <button class="action-btn" id="playPauseBtn" title="Play">
                                <img id="playPauseIcon" src="res/logo/media/play.svg" alt="play">
                            </button>

                            <!-- Prev -->
                            <button class="action-btn" id="prevBtn" title="Previous">
                                <img src="res/logo/media/prev.svg" alt="previous">
                            </button>

                            <!-- Time and Seek -->
                            <div class="time-container">
                                <span class="time-current" id="timeCurrent">0:00</span>
                                <div class="progress-container" id="progressContainer">
                                    <div class="progress-bar" id="progressBar"></div>
                                    <div class="progress-scrubber" id="progressScrubber"></div>
                                </div>
                                <span class="time-duration" id="timeDuration">0:00</span>
                            </div>

                            <!-- Next -->
                            <button class="action-btn" id="nextBtn" title="Next">
                                <img src="res/logo/media/next.svg" alt="next">
                            </button>
                        </div>
                    </div>

                    <!-- BOOKMARK -->
                    <div class="bookmark-container">
                        <div class="bookmark-heading">
                            <img src="../res/logo/bookmark.svg" alt="bookmark">
                            <img src="../res/logo/add.svg" id="manageBookmarkBtn" alt="manage">
                        </div>
                        <div id="bookmark-body">
                            <!-- <a class="bookmark-option">
                                <img src="https://www.google.com/s2/favicons?domain=facebook.com&size=128" alt="">
                                <p class="bookmark-value">Facebook</p>
                            </a> -->
                        </div>
                    </div>

                </div>


            </div>

            <!-- ROW 2 -->
            <div class="widget-wrapper">

                <!-- NOTEPAD -->
                <div class="notepad-container" id="notepadContainer">
                    <div class="notepad-heading">
                        <img class="notepad_logo" src="res/logo/notepad.svg" alt="notepad">

                        <div class="notepad-tabs">
                            <div class="notepad-tabs-list" id="notepadTabsList"></div>
                            <button class="tab-add-btn" id="tabAddBtn" title="Add Tab">+</button>
                        </div>

                        <div class="notepad-controls">
                            <!-- Group 0: Sync -->
                            <div class="control-group">
                                <img src="res/logo/sync.svg" id="syncBtn" alt="sync" title="Save to localStorage">
                            </div>

                            <!-- Group 1: Split Toggle (Switch) -->
                            <div class="control-group">
                                <label class="switch-label" title="Toggle Split View">
                                    <input type="checkbox" id="toggleSplitBtn">
                                    <span class="switch-slider">
                                        <img src="res/logo/split.svg" alt="split" class="switch-icon">
                                    </span>
                                </label>
                            </div>

                            <!-- Group 2: Preview Toggle -->
                            <div class="control-group">
                                <img src="res/logo/play.svg" id="togglePreviewBtn" alt="preview"
                                    title="Toggle Preview Mode">
                            </div>

                            <!-- Group 3: Export Pair -->
                            <div class="control-group paired">
                                <img src="res/logo/save.svg" alt="save" id="exportBtn" title="Save as Text (.txt)">
                                <div class="v-divider"></div>
                                <img src="res/logo/md.svg" alt="export" id="exportMDBtn"
                                    title="Export as Markdown (.md)">
                            </div>

                            <!-- Group 4: Full Screen -->
                            <div class="control-group">
                                <img src="res/logo/expand.svg" alt="full screen" id="fullScreenBtn"
                                    title="Full Screen Mode">
                            </div>

                            <!-- Group 5: Reset -->
                            <div class="control-group">
                                <img src="res/logo/undo.svg" alt="reset" id="resetBtn" title="Clear Notepad">
                            </div>
                        </div>
                    </div>
                    <div class="notepad-body">
                        <textarea spellcheck="false" name="notepad" id="notepad"
                            placeholder="Write your thoughts..."></textarea>
                        <div id="notepadPreview" class="notepad-preview" style="display: none;"></div>
                    </div>
                </div>


                <!-- TODO -->
                <div class="todo-container">
                    <div class="todo-heading">
                        <img src="../res/logo/todo.svg" alt="todo">
                        <img src="../res/logo/delete.png" alt="del" id="deleteAllTaskBtn">
                    </div>
                    <div class="todo-body">
                        <ul>
                            <!-- <li> 
                                <div class="todo-task">
                                    <span class="todo-check"></span>
                                    <p class="taskName">No Task</p>
                                </div> 
                                
                                <img src="../res/logo/close.svg" alt="delete">
                            </li> -->
                        </ul>

                    </div>

                    <div class="todo-addTaskBody">
                        <input type="text" id="taskName" placeholder="Task Name">
                        <img src="../res/logo/add.svg" id="addTaskBtn" alt="add">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="/res/js/jquery.js"></script>
<script src="res/js/config.js"></script>
<script src="res/js/script.js"></script>

<script src="res/js/marked.js"></script>
<!-- JS -->

</html>
