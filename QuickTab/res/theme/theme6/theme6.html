<style>
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url(/res/theme/theme6/fonts/Inter-ExtraLight.woff2) format('woff2');
    }

    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/res/theme/theme6/fonts/Inter-Regular.woff2) format('woff2');
    }

    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/res/theme/theme6/fonts/Inter-Medium.woff2) format('woff2');
    }

    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/res/theme/theme6/fonts/Inter-SemiBold.woff2) format('woff2');
    }

    #theme6-main {
        position: absolute;
        inset: 0;
        height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 160px;
        text-align: center;
        user-select: none;
    }

    #greeting-label {
        font-family: 'Inter';
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.4);
        margin: 0 0 8px;
    }

    #clock {
        font-family: 'Inter';
        font-weight: 200;
        font-size: 80px;
        color: #fff;
        line-height: 1;
        letter-spacing: -0.05em;
        text-shadow: 0 2px 40px rgba(0, 0, 0, 0.3);
        margin: 0 0 8px;
    }

    .date-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-family: 'Inter';
        font-weight: 400;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 32px;
    }

    .date-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        flex-shrink: 0;
    }

    .date-weather-icon {
        width: 14px;
        height: 14px;
        display: none;
    }

    .search-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        max-width: 530px;
    }

    .search-wrap {
        position: relative;
        flex: 0 1 auto;
        min-width: 0;
        width: 100%;
        max-width: 448px;
    }

    #tabBtn {
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    #tabBtn:hover {
        background: var(--theme);
        border-color: var(--theme);
    }

    #tabBtn img {
        width: 24px;
        height: 24px;
        filter: invert(1);
        opacity: 0.85;
    }

    #module-search {
        width: 100%;
        padding: 14px 80px 14px 44px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 14px;
        font-family: 'Inter';
        font-weight: 400;
        color: #fff;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    #module-search::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    #module-search:focus {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
    }

    .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        opacity: 0.25;
        pointer-events: none;
    }

    .search-badge {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        pointer-events: none;
    }

    .search-badge kbd {
        display: none;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-family: Consolas, Menlo, monospace;
        color: rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media screen and (min-width: 640px) {
        #theme6-main {
            padding: 0 24px 144px;
        }

        #greeting-label {
            margin-bottom: 12px;
        }

        #clock {
            font-size: 88px;
            margin-bottom: 8px;
        }

        .date-row {
            gap: 12px;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .search-wrap {
            max-width: 512px;
        }

        #module-search {
            padding: 16px 96px 16px 48px;
        }

        .search-icon {
            left: 20px;
        }

        .search-badge {
            right: 12px;
        }

        .search-badge kbd {
            display: inline-block;
        }
    }

    @media screen and (min-width: 1024px) {
        #clock {
            font-size: 112px;
        }
    }
</style>

<main id="theme6-main">
    <p id="greeting-label">Good night</p>

    <p id="clock">11:38 PM</p>

    <div class="date-row">
        <span id="date">Tuesday, September 8, 2026</span>
        <span class="date-dot"></span>
        <img class="date-weather-icon" id="date-weather-icon" alt="">
        <span id="date-weather-text">18Â°C, Dhaka</span>
    </div>

    <div class="search-container">
        <div class="search-wrap">
            <img class="search-icon" src="/res/logo/search.svg" alt="search">
            <input type="text" id="module-search" placeholder="Search or jump to...">
            <div class="search-badge">
                <kbd>Enter</kbd>
            </div>
        </div>
        <button id="tabBtn">
            <img src="/res/logo/tabs.svg" alt="tabs">
        </button>
    </div>
</main>
