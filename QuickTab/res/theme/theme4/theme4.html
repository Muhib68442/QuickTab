<style>
    #theme4-main {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
        user-select: none;
    }

    #time {
        font-size: 150px;
        font-family: fontB;
        color: var(--text-w);
        line-height: 1;
        letter-spacing: -5px;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        margin: 0;
    }

    #date {
        font-size: 24px;
        font-family: fontM;
        color: var(--text-w);
        opacity: 0.8;
        margin-top: -10px;
    }

    .search-container {
        width: 100%;
        max-width: 500px;
        margin-top: 30px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .searchbar {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        padding: 12px 25px;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .searchbar:focus-within {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        transform: scale(1.02);
    }

    .searchbar img {
        width: 20px;
        height: 20px;
        opacity: 0.7;
    }

    .searchbar input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-w);
        font-size: 18px;
        font-family: fontM;
        width: 100%;
        padding-left: 15px;
    }

    #tabBtn {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid #ffffff1a;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #tabBtn:hover {
        background: var(--theme);
    }

    #tabBtn img {
        width: 24px;
        height: 24px;
        filter: invert(1);
    }

    .tabContainer {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 10px 20px;
        gap: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 1000;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideUp {
        from {
            transform: translate(-50%, 50px);
            opacity: 0;
        }

        to {
            transform: translate(-50%, 0);
            opacity: 1;
        }
    }

    .tabContainer a {
        text-decoration: none;
        color: #fff;
        font-size: 16px;
        font-family: fontM;
        padding: 8px 15px;
        border-radius: 12px;
        transition: 0.2s;
    }

    .tabContainer a:hover {
        background: var(--theme);
    }

    @media screen and (max-width: 768px) {
        #time {
            font-size: 100px;
        }

        .search-container {
            max-width: 80%;
        }
    }
</style>

<main id="theme4-main">
    <p id="time">00:00</p>
    <p id="date">Monday, January 1</p>

    <div class="search-container">
        <div class="searchbar">
            <img src="/res/logo/search.svg" alt="search">
            <input type="text" placeholder="Search the web...">
        </div>
        <button id="tabBtn">
            <img src="/res/logo/tabs.svg" alt="tabs">
        </button>
    </div>

    <div class="tabContainer">
        <a href="/res/theme/settings.html" class="settingsBtn">Settings</a>
    </div>
</main>
